# Validates manifest.json, strings.json/translations, and general
# custom_component structure against Home Assistant's own schema - the same
# check core integrations must pass. See:
# https://developers.home-assistant.io/blog/2020/04/16/hassfest/
name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
